name: Claude Code Review (official)

# The only Claude workflow. Two jobs, so each gets the permissions it needs:
#  - review:  automatic review when a non-draft PR is opened or marked ready for review
#  - respond: acts on an explicit '@claude' comment on a PR (can also commit)
#
# The job id "review" is also the name of the status check. The "Worktree Afronden" script
# waits for a check with exactly that name, so do not rename the job without updating the script.

on:
  pull_request:
    # Never on synchronize: one review per PR, not one per push.
    types: [opened, ready_for_review]
    # No review for a PR that only changes documentation (CNT-232): the run costs a billed minute and
    # Claude usage for prose. GitHub judges each file of the PR by the last pattern it matches (a leading
    # '!' leaves it out) and starts the review when at least one file ends up included. Markdown and
    # docs/** are left out; agent instructions and baseline blocks are taken back in, because they steer
    # agents. The finish script reads this list (scripts/finish/review-paths.mjs in control) to know when
    # no review comes, and only understands '**', '*' and a leading '!': it refuses any other syntax.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - ".claude/**"
      - "baseline/blocks/**"
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    # Every job has a timeout (baseline workflow:minute-rules), so a hanging run cannot use 360 minutes.
    timeout-minutes: 20
    # Not on Dependabot PRs: they get no secrets, so the review would fail on every one of them.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    # A newer review of the same PR replaces a running one. Comment runs are never
    # cancelled: the 'respond' job has no concurrency group at all.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Start time of this attempt, so the comment check below only counts comments of this run.
      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Bun for the action, from the npm registry (CNT-225). The action's own 'Install Bun' step downloads it
      # from GitHub Releases on every run, without a cache; a 504 there failed every review. With
      # path_to_bun_executable set, the action skips that step. BUN_VERSION must equal 'bun-version' in
      # action.yml of the pinned claude-code-action: bump both together (workflow-review-bun.test.mjs).
      # An explicit prefix gives a known path. --allow-scripts=bun lets the package's postinstall (npm skips
      # install scripts by default) put the native binary of @oven/bun-linux-x64 (also from npm) in place.
      - name: Install Bun from npm
        id: bun
        env:
          BUN_VERSION: "1.4.4"
        run: |
          prefix="$RUNNER_TEMP/bun"
          npm install --global --prefix "$prefix" --allow-scripts=bun --no-audit --no-fund "bun@$BUN_VERSION"
          bun_path="$prefix/bin/bun"
          installed="$("$bun_path" --version)"
          if [ "$installed" != "$BUN_VERSION" ]; then
            echo "::error::Expected Bun $BUN_VERSION at $bun_path, got '$installed'."
            exit 1
          fi
          echo "path=$bun_path" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Alternative to the line above, when using an API key:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Bun from the step above, so the action skips its download from GitHub Releases.
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
          plugins: |
            pr-review-toolkit@claude-code-plugins
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW LANGUAGE: English

            Please review this PR comprehensively.
            Use the pr-review-toolkit agents to check:
            - Code quality and style (code-reviewer)
            - Test coverage (pr-test-analyzer)
            - Error handling (silent-failure-hunter)
            - Type design (type-design-analyzer)
            - Comment accuracy (comment-analyzer)

            Pay extra attention to: this is a Vite + React 19 + TypeScript app (tsconfig is
            not strict: strictNullChecks and noImplicitAny are off, so check null and undefined
            handling by hand) with shadcn/ui components and Supabase as the backend.
            - Every user-facing string goes through the translations in
              src/contexts/LanguageContext.tsx for all four app languages (nl, en, fr, es); flag
              hard-coded UI text and keys missing in one of the languages.
            - Supabase: new tables in supabase/migrations/ enable row level security with policies
              that limit rows to the owning user or the admin role; flag service-role keys or
              secrets in frontend code or .env, and queries that rely on the client to filter
              other users' data. src/integrations/supabase/types.ts must match the migrations.
            - Edge functions in supabase/functions/ run on Deno: they must check the caller's JWT
              themselves where supabase/config.toml sets verify_jwt = false, validate their input,
              and return explicit error responses instead of swallowing failures.
            - Supabase calls in components: errors are checked and shown (toast), not ignored.
            - Files in src/components/ui/ are generated shadcn/ui components; changes there need a
              reason.
            - New logic in src/lib/ comes with Vitest tests (src/**/*.test.ts).

            Also check that the conventions in this repo's CLAUDE.md are followed and that
            conventional commits are used correctly.

            REVIEW FORMAT (mandatory). Report findings only, in exactly this order:
            1. Verdict: one or two sentences stating whether the PR has blocking issues (yes/no).
            2. Blocking issues: problems that must be fixed before merge (bugs, data loss, security
               or trust-boundary problems, broken tests, missing error handling that hides failures).
               For each: file and line, what is wrong, and the fix. Omit the section if there are none.
            3. Unrecorded decisions: choices in the diff that are not recorded under `## Besluiten` in the
               PR body (see UNRECORDED DECISIONS below). This is a kind of finding of its own, never a
               blocking or non-blocking issue. For each: file and line, and the choice in one line. Omit
               the section if there are none.
            4. Non-blocking issues: suggestions, nits and improvements, short and one line each.
               Omit the section if there are none.
            Do NOT list what is fine or what you checked (conventions followed, scope, secrets,
            Next.js/Expo APIs, i18n, the `Closes` line, tests present, and so on). If you found
            nothing, the verdict alone is the whole review.
            Do NOT comment on the model named in the `Co-Authored-By` line of commits or the PR body.
            Do NOT mention tools or MCP servers that are unavailable in this review job (for example
            the Supabase or IssueTracker MCP); that is expected and not a finding.

            UNRECORDED DECISIONS (mandatory):
            - Agents record every decision with the `record_decision` tool of the `issues` MCP server.
              A generated section `## Besluiten` in the PR body lists the recorded ones, between fixed
              markers. Read the PR body with `gh pr view ${{ github.event.pull_request.number }}`.
            - A decision is a choice between at least two realistic options that changes the result:
              behaviour, structure, scope, data model, dependencies, or something hard to undo. Not a
              decision: a step that a rule prescribes (CLAUDE.md, the baseline, a decision in
              `baseline/decisions/`, the task brief), a choice the owner already made in the ticket, the
              brief or the chat, and a choice without effect outside the change itself.
            - Compare the diff with `## Besluiten`. Report every choice in the diff that is not in that
              list, also when the section is absent. Do not treat the section as proof that a listed
              decision was the right one; only check that the choice is recorded.
            - Choices the owner already made are listed by the agent in the PR body under the heading
              `## Keuzes van de eigenaar`, each with a reference to the ticket or the brief. Do not report
              a choice listed there as an unrecorded decision, unless the reference is missing or wrong. Check
              that the ticket or the brief really holds the choice; if a listed choice has no reference,
              or the reference does not hold that choice, report it as an unrecorded decision.
            - Never write, edit or generate the `## Besluiten` section yourself.

            HOW TO WORK (mandatory):
            - Get the changes with `gh pr diff ${{ github.event.pull_request.number }}`. There are no
              unstaged changes in this checkout, so tell every agent you start to review this PR's
              diff (it may use `gh pr diff`, `git diff`, `git log` and `git show`), not `git diff`
              of the working tree.
            - Only these tools are allowed: the agents, Read, Grep, Glob, `gh pr comment|review|diff|view`
              and `git diff|log|show`. A refused tool call is not a reason to stop: carry on with
              what you have.
            - Wait for every agent you start to finish before you write the review.
            - ALWAYS finish by posting exactly one PR comment with `gh pr comment`, also when an agent
              or a tool failed (then say in the comment what could not be checked) and also when the
              verdict alone is the whole review. Pass the text directly with `--body "..."`; command
              substitution such as `$(cat ...)` is refused. The review job fails when no comment is
              posted.

            Post review results as a PR comment using `gh pr comment`.
            Use `gh pr review` for inline comments on specific code lines.
            Write all reviews in English.
          # --strict-mcp-config: only use the MCP servers the action passes itself. Without it,
          # the checkout's .mcp.json loads the Linear server, which needs LINEAR_FAMILYSKILLS_API_KEY
          # (not set in CI) and fails with 401 on every review.
          # Agent/Task start the pr-review-toolkit agents (refused without them, FAM-327); those
          # agents read the changes with git, hence the read-only git commands. No Write, Edit or
          # other Bash.
          claude_args: |
            --strict-mcp-config --allowedTools "Agent,Task,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"

      # The action hides what Claude did (show_full_output is off, and a debug re-run does not
      # show it either). Keep the transcript for a week, so a review without a comment can be
      # explained. Only people with access to the repo can download it.
      - name: Keep the review transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7

      # The action can end green without posting anything (FAM-327, CNT-55). Without the review
      # comment no agent sets 'agent-klaar' and the finish script never offers the PR, so fail
      # instead. Exception: on a PR that changes this workflow the action skips itself (its
      # workflow validation requires the file to match the default branch), so there is no
      # comment to expect.
      - name: Require the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STARTED_AT: ${{ steps.started.outputs.at }}
          # owner/repo/.github/workflows/<file>.yml@<ref>; the file name differs per repo.
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REVIEW_BOT: claude[bot]
        run: |
          workflow_file="${WORKFLOW_REF#"$REPO"/}"
          workflow_file="${workflow_file%%@*}"
          if ! git diff --quiet "origin/$DEFAULT_BRANCH" -- "$workflow_file"; then
            echo "::notice::This PR changes $workflow_file, so the review action skipped itself; no comment expected."
            exit 0
          fi
          count=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"$REVIEW_BOT\" and .created_at >= \"$STARTED_AT\")] | length" \
            | awk '{ total += $1 } END { print total + 0 }')
          if [ "$count" -eq 0 ]; then
            echo "::error::The Claude review posted no PR comment. Re-run this job."
            exit 1
          fi
          echo "Found $count review comment(s) from $REVIEW_BOT."

  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the owner and organisation members (CNT-67): this job has write access and the Claude
    # token, and on a public repo anyone can comment. A comment from anyone else starts nothing.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Bun for the action, from the npm registry (CNT-225). The action's own 'Install Bun' step downloads it
      # from GitHub Releases on every run, without a cache; a 504 there failed every review. With
      # path_to_bun_executable set, the action skips that step. BUN_VERSION must equal 'bun-version' in
      # action.yml of the pinned claude-code-action: bump both together (workflow-review-bun.test.mjs).
      # An explicit prefix gives a known path. --allow-scripts=bun lets the package's postinstall (npm skips
      # install scripts by default) put the native binary of @oven/bun-linux-x64 (also from npm) in place.
      - name: Install Bun from npm
        id: bun
        env:
          BUN_VERSION: "1.4.4"
        run: |
          prefix="$RUNNER_TEMP/bun"
          npm install --global --prefix "$prefix" --allow-scripts=bun --no-audit --no-fund "bun@$BUN_VERSION"
          bun_path="$prefix/bin/bun"
          installed="$("$bun_path" --version)"
          if [ "$installed" != "$BUN_VERSION" ]; then
            echo "::error::Expected Bun $BUN_VERSION at $bun_path, got '$installed'."
            exit 1
          fi
          echo "path=$bun_path" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Alternative to the line above, when using an API key:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Bun from the step above, so the action skips its download from GitHub Releases.
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          # Must match the '@claude' check in the if-condition above exactly. Without this line
          # the action does not recognise its own (different) default trigger phrase in the
          # comment and skips everything ("No trigger found, skipping").
          trigger_phrase: "@claude"
          # Same as the review job: keep the checkout's .mcp.json (Linear, no API key in CI) out of the run.
          claude_args: |
            --strict-mcp-config
